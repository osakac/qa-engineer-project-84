- summary: |
    Успешное переключение локализации
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites: |
    - Открыта страница сайта
    - Выбран английский язык
  steps:
    - Нажать кнопку "Language" в меню
    - Выбрать вариант "Russian"
  expected-result: |
    Интерфейс сайта сменился на русский язык
